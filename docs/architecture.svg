<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1420 610" width="1420" height="610" role="img" aria-labelledby="t d" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif">
<title id="t">Pipeline architecture</title><desc id="d">Raw data is cleaned, split into train and test, analysed for treatment effect, prediction and heterogeneity, validated, and served by a dashboard. The same protocol is replicated on GBSG2.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1526"/><stop offset="1" stop-color="#10243a"/></linearGradient>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#38bdf8"/></linearGradient>
<linearGradient id="dash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0f766e"/><stop offset="1" stop-color="#155e75"/></linearGradient>
<filter id="sh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity=".35"/></filter>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1L9 5L0 9z" fill="#5eead4"/></marker>
<style>
.node{animation:in .7s ease-out backwards}
.edge{fill:none;stroke:#5eead4;stroke-width:2;stroke-opacity:.85;stroke-dasharray:7 7;animation:flow 1.1s linear infinite}
.base{fill:none;stroke:#1e3a52;stroke-width:5;stroke-linecap:round}
.pulse{animation:pulse 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.ring{animation:ring 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
.band{stroke-dasharray:6 6;animation:flow 2.4s linear infinite}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes flow{to{stroke-dashoffset:-14}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
@keyframes ring{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){.node{animation:none}.edge,.band,.pulse,.ring{animation:none}}
</style>
</defs>
<rect width="1420" height="610" rx="18" fill="url(#bg)"/>
<rect x=".5" y=".5" width="1419" height="609" rx="18" fill="none" stroke="#24415c"/>
<text x="36" y="44" font-size="22" font-weight="700" fill="#f1f5f9">Pipeline architecture</text>
<text x="36" y="66" font-size="13" fill="#94a3b8">One leakage-safe protocol · two trials · results served by a dashboard</text>
<rect x="1174" y="26" width="210" height="30" rx="15" fill="#0f2a3d" stroke="#2dd4bf" stroke-opacity=".5"/>
<g transform="translate(1188,33)" fill="none" stroke="#5eead4" stroke-width="1.8"><rect x="0" y="6" width="12" height="9" rx="2"/><path d="M3 6V4a3 3 0 016 0v2"/></g>
<text x="1213" y="46" font-size="12.5" font-weight="600" fill="#5eead4">Test set opened once</text>
<text x="115.0" y="86" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64829e">DATA</text>
<text x="345.0" y="86" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64829e">PREPARE</text>
<text x="575.0" y="86" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64829e">SPLIT</text>
<text x="805.0" y="86" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64829e">ANALYSE</text>
<text x="1035.0" y="86" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64829e">PREDICT · VALIDATE</text>
<text x="1285.0" y="86" text-anchor="middle" font-size="11" font-weight="700" letter-spacing="1.6" fill="#64829e">DELIVER</text>
