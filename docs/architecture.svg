<text x="48" y="297" font-size="12" fill="#5eead4" font-family="Consolas, Menlo, monospace">ACTG 175 · GBSG2</text>
<text x="48" y="314" font-size="11.5" fill="#94a3b8">Two public trials</text>
</g>
